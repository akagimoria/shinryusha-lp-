<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 背景 -->
  <rect width="32" height="32" rx="6" fill="#0b0d14"/>
  <!-- 本の影 -->
  <rect x="7" y="22" width="18" height="2" rx="1" fill="rgba(0,0,0,0.35)"/>
  <!-- 本体（背表紙＋表紙） -->
  <rect x="7" y="6" width="18" height="17" rx="1.5" fill="#c9a85c"/>
  <!-- 表紙の縁取り（深み） -->
  <rect x="7" y="6" width="18" height="17" rx="1.5" fill="none" stroke="#8a6c2e" stroke-width="0.8"/>
  <!-- 背表紙ライン -->
  <rect x="9" y="6" width="1" height="17" fill="#8a6c2e"/>
  <!-- 上下の帯（装丁） -->
  <rect x="7" y="9.5" width="18" height="0.8" fill="#8a6c2e"/>
  <rect x="7" y="19" width="18" height="0.8" fill="#8a6c2e"/>
  <!-- 中央の装飾線 -->
  <rect x="13" y="13" width="6" height="0.8" fill="#0b0d14" opacity="0.7"/>
  <rect x="13" y="15.5" width="6" height="0.8" fill="#0b0d14" opacity="0.7"/>
</svg>
